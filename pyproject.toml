[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "sage-bot"
version = "0.1.0.dev0"
description = "An open-source AI assistant for Slack"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "fastapi==0.162.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.12.5",
  "pydantic-settings==2.14.2",
  "uvicorn==0.54.0",
]

[project.scripts]
sage-bot-server = "sage_bot.api.server:main"

[project.urls]
Repository = "https://github.com/devprax/sage-bot"
Issues = "https://github.com/devprax/sage-bot/issues"

[dependency-groups]
dev = [
  "httpx2==2.16.0",
  "jsonschema==4.26.0",
  "openapi-spec-validator==0.9.0",
  "pytest==9.0.3",
  "pyyaml==6.0.3",
  "ruff==0.14.13",
  "ty==0.0.99",
  "types-pyyaml==6.0.12.20260906",
]

[tool.uv]
required-version = "==0.13.7"
default-groups = ["dev"]
index-strategy = "first-index"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_bot"]

[tool.ruff]
required-version = "==0.14.13"
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "S", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
filterwarnings = ["error"]
