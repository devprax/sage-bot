Liveness:
  type: object
  description: Liveness has a single state; failure is the absence of a response.
  required: [status]
  additionalProperties: false
  properties:
    status:
      const: ok
Readiness:
  type: object
  description: Whether the service can do work. A not-ready response gives no reason.
  required: [status]
  additionalProperties: false
  properties:
    status:
      enum: [ok, not_ready]
