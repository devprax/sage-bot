live:
  get:
    tags: [Health]
    operationId: health_live
    summary: Report liveness
    description: |-
      Confirms the HTTP service is running. Reads no configuration, contacts no database or
      external service, and reveals no version or internal details.
    security: []
    responses:
      '200':
        description: The HTTP service is running.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/health.yaml#/Liveness
  head:
    tags: [Health]
    operationId: health_live_head
    summary: Report liveness without a body
    description: Same status and headers as `GET /health/live`, with an empty body.
    security: []
    responses:
      '200':
        description: The HTTP service is running.
ready:
  get:
    tags: [Health]
    operationId: health_ready
    summary: Report readiness
    description: |-
      Reports whether the service can do work: its settings are valid and, within the configured
      readiness timeout, PostgreSQL reports the database schema revision this release expects
      (apply it with `sage-bot-migrate`). Reveals no reason, version or internal details;
      liveness is unaffected.
    security: []
    responses:
      '200':
        description: The service is ready.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/health.yaml#/Readiness
      '503':
        description: The service is not ready.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/health.yaml#/Readiness
  head:
    tags: [Health]
    operationId: health_ready_head
    summary: Report readiness without a body
    description: Same status and headers as `GET /health/ready`, with an empty body.
    security: []
    responses:
      '200':
        description: The service is ready.
      '503':
        description: The service is not ready.
