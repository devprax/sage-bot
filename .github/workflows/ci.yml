name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.12", "3.13", "3.14"]
    services:
      # Disposable database for the PostgreSQL integration tests; test-only credentials.
      postgres:
        image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_USER: sage_test
          POSTGRES_PASSWORD: sage_test_password
          POSTGRES_DB: sage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sage_test -d sage_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      SAGE_TEST_DATABASE_URL: postgresql://sage_test:sage_test_password@localhost:5432/sage_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.13.7"

      - name: Install locked dependencies
        run: make setup

      - name: Check lock, lint, formatting, types, and tests
        run: make check

      - name: Build source distribution and wheel
        run: make build
